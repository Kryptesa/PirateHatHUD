; Pirate Hat HUD
; x is measured from the left edge. A negative y places the icon that many
; pixels above the bottom edge; a nonnegative y is measured from the top.
[indicator]
; Delay only the return after minimap visible and menu closed (0..60000 ms).
show_delay_ms=1000
enabled=1
; Diagnostic only: show the icon regardless of treasure state.
; Diagnostic icon still requires a visible enabled minimap.
force_show=0
x=350
y=-310
scale_percent=100

[sound]
; One sound when treasure detection becomes active; no startup or menu-return sound.
enabled=1
; Minimum interval between sounds (0..60000 ms).
cooldown_ms=1000
; Additional notification volume after game master/effects scaling (0..100%).
; Zero mutes notifications; 100 keeps the current amplitude.
; Saved changes apply within about one second without restarting the game.
volume_percent=100

[hotkeys]
toggle=F9
; Disable the mod for this session; activated hook code stays loaded until game exit.
unload=F10

[logging]
; trace, debug, info, warn, error, off. State transitions require debug.
level=info
; Rotate at startup and on size limit (1..100 MB).
max_file_size_mb=5
; Total files including current (1..20). Filename timestamps use UTC.
max_files=3
