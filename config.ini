; Pirate Hat HUD
; Settings apply at the next game launch unless marked "Live".

[indicator]
; Initial icon/sound state (0=off, 1=on; default 1). The toggle hotkey changes it in game.
enabled=1
; Test icon without hat/treasure detection (0=off, 1=on; default 0).
; Still hidden in menus and when the minimap is hidden.
force_show=0
; Horizontal position from the left edge, in pixels (default 350).
x=350
; Vertical position in pixels (default -310). Negative: up from bottom; otherwise: from top.
y=-310
; Icon size as a percentage of its base size (default 100; range 25-400).
scale_percent=100
; Icon return delay after the minimap appears and menus close, in ms (default 1000; range 0-60000).
show_delay_ms=1000

[sound]
; Treasure notifications (0=off, 1=on; default 1), including initial active detection after loading.
enabled=1
; Minimum interval between notifications, in ms (default 1000; range 0-60000).
cooldown_ms=1000
; Notification volume after game master/effects scaling, in percent (default 100; range 0-100).
; Live: saved edits apply within about one second. Zero mutes; 100 keeps the current amplitude.
volume_percent=100

[treasure]
; Optional hat range override (0=off, 1=on; default 0), independent of the icon/sound toggle.
; When off at startup, no radius lookup, write or settings polling occurs.
enabled=0
; Pirate King Hat detection radius, in meters (default 15; range 1-1000; decimals allowed).
; Live when enabled at startup: saved edits apply within about two seconds.
; The unload hotkey restores the original radius if it is still owned by this mod.
radius=15

[hotkeys]
; Toggle the icon and sound (default F9; choices F8, F9, F10, F11). Does not change hat range.
toggle=F9
; Stop the mod until the next launch and restore its radius override (default F10).
; Choices: F8, F9, F10, F11. Use a different key from toggle.
unload=F10

[logging]
; Log detail (default info; choices trace, debug, info, warn, error, off).
; State transitions and detailed diagnostics require debug or trace.
level=info
; Maximum size of one log file, in MB (default 5; range 1-100). Logs also rotate at startup.
max_file_size_mb=5
; Total log files to keep, including the current file (default 3; range 1-20).
; Log filenames and timestamps use UTC.
max_files=3
